name: pages

# Builds the standalone demo (the dashboard, the engine in a Web Worker, the
# demo images and their same-origin /v2 registry) and publishes it at
# https://go-wasmcontainers.github.io/dashboard/, then checks the CDN serves
# this build.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.27.3' }
      - run: go version
      - name: build the site
        run: |
          go run ./cmd/site build --out _site --version "${GITHUB_SHA::12}"
          ls -la _site
      - uses: actions/upload-pages-artifact@v5
        with: { path: _site }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: the live page serves this build
        shell: bash
        run: |
          set -euo pipefail
          url=https://go-wasmcontainers.github.io/dashboard/
          want="${GITHUB_SHA::12}"
          for i in $(seq 1 60); do
            if curl -fsS "$url" -o page.html && grep -q "app.js?v=$want" page.html; then
              curl -fsS -o /dev/null "${url}dashboard.wasm?v=$want"
              curl -fsS -o /dev/null "${url}engine.wasm?v=$want"
              curl -fsS -o /dev/null "${url}v2/library/hello/manifests/latest"
              echo "live: $url serves build $want" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 20
          done
          echo "::error::$url does not serve build $want"
          exit 1
