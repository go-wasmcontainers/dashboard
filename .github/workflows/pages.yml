name: pages

# Builds the standalone demo (the dashboard, the engine in a Web Worker, the
# demo images and their same-origin /v2 registry) and publishes it at
# https://go-wasmcontainers.github.io/dashboard/, then checks the CDN serves
# this build.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.27.3' }
      - run: go version
      # The site is written OUTSIDE the checkout: an untracked _site/ in the
      # work tree stamped the programs vcs.modified=true (v0.4.2 shipped as
      # v0.0.0-...+dirty).
      - name: build the site
        run: |
          go run ./cmd/site build --out "$RUNNER_TEMP/_site" --version "${GITHUB_SHA::12}"
          ls -la "$RUNNER_TEMP/_site"
      - name: the programs come from this commit, unmodified
        run: go run ./cmd/site check --revision "$GITHUB_SHA" "$RUNNER_TEMP/_site/dashboard.wasm" "$RUNNER_TEMP/_site/engine.wasm"
      - uses: actions/upload-pages-artifact@v5
        with: { path: "${{ runner.temp }}/_site" }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: the live page serves this build
        shell: bash
        run: |
          set -euo pipefail
          url=https://go-wasmcontainers.github.io/dashboard/
          want="${GITHUB_SHA::12}"
          for _ in $(seq 1 60); do
            if curl -fsS "$url" -o page.html && grep -q "app.js?v=$want" page.html; then
              curl -fsS -o /dev/null "${url}dashboard.wasm?v=$want"
              curl -fsS -o /dev/null "${url}engine.wasm?v=$want"
              curl -fsS -o /dev/null "${url}v2/library/hello/manifests/latest"
              echo "live: $url serves build $want" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 20
          done
          echo "::error::$url does not serve build $want"
          exit 1

  # Then use it, in Chromium and Firefox, as a visitor does (the service
  # worker isolates the page): run from the terminal, select, logs, events,
  # stats, Stop by click, the action echoed in the terminal.
  live:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.27.3' }
      - uses: actions/setup-node@v7
        with: { node-version: 26 }
      # The driver is assembled from npm (playwright-core 1.57.0, the
      # version playwright-go v0.5700.1 speaks), integrity-checked, by the
      # playground's tool.
      - name: Playwright driver and ${{ matrix.browser }}
        run: |
          echo "PLAYWRIGHT_DRIVER_PATH=$RUNNER_TEMP/pwdriver" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_NODEJS_PATH=$(command -v node)" >> "$GITHUB_ENV"
          go run github.com/go-wasmcontainers/playground/cmd/site@v0.1.0 playwright-driver --version 1.62.1 --dir "$RUNNER_TEMP/pwdriver"
          PLAYWRIGHT_DRIVER_PATH="$RUNNER_TEMP/pwdriver" PLAYWRIGHT_NODEJS_PATH="$(command -v node)" \
            go run github.com/mxschmitt/playwright-go/cmd/playwright install --with-deps ${{ matrix.browser }}
      - name: the live page, used in ${{ matrix.browser }}
        env:
          E2E_URL: https://go-wasmcontainers.github.io/dashboard/
          E2E_BROWSERS: ${{ matrix.browser }}
        run: go test -tags e2e -count=1 -v -timeout 15m ./e2e/ > "$RUNNER_TEMP/live.log" 2>&1; status=$?; tail -30 "$RUNNER_TEMP/live.log"; exit $status
