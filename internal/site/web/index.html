<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; connect-src 'self'; worker-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>wctr dashboard</title>
<meta name="description" content="A graphical dashboard for the go-wasmcontainers engine, with a wctr terminal, in a browser tab: WebAssembly containers, built with go-widgets.">
<style>
  html, body { margin: 0; height: 100%; background: #0f1419; color: #e6e1cf; font: 15px/1.5 system-ui, sans-serif; overflow: hidden; }
  #screen { display: block; width: 100vw; height: 100vh; }
  #status { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 16px; }
  #status[hidden] { display: none; }
</style>
</head>
<body>
<div id="status">Starting the engine…</div>
<canvas id="screen" tabindex="0" aria-label="wctr dashboard: containers, images, volumes and a wctr terminal"></canvas>
<script src="wasm_exec.js?v={{BUILD}}"></script>
<script src="app.js?v={{BUILD}}" data-build="{{BUILD}}"></script>
</body>
</html>
